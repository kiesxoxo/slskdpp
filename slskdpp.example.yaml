# Copy to slskdpp.yaml. Any value can also be set with SLSKDPP_* env vars
# (e.g. SLSKDPP_USERNAME, SLSKDPP_PASSWORD, SLSKDPP_LISTEN_PORT).
soulseek:
  username: ""
  password: ""
  server: server.slsknet.org:2242
  listen_port: 2234   # forward this TCP port on your router for best results

directories:
  data: data          # database and state
  # downloads: data/downloads
  # incomplete: data/incomplete

web:
  listen: ":5030"     # web UI and API
  username: slskdpp
  password: ""        # empty: a random password is generated and logged at startup
  api_keys: []        # for scripts (X-API-Key header); also SLSKDPP_API_KEY; more can be made in Settings
  trusted_proxies: [] # reverse proxies whose X-Forwarded-For is believed (IPs or CIDRs); loopback when empty
  remote_file_management: false # let the slskd-compatible API delete downloaded and incomplete files

transfers:
  max_attempts: 5               # tries per source before looking for another
  max_sources: 3                # users a file is tried from before giving up
  download_speed_limit: 0       # KiB/s, 0 = unlimited
  per_download_speed_limit: 0   # KiB/s per file
  upload_slots: 2               # uploads at once, one per user
  max_queued_per_user: 500      # files one user may queue from us
  upload_speed_limit: 0         # KiB/s, 0 = unlimited

wishlist:
  interval: 0       # minutes between wishlist searches; 0 = as often as the server allows

# Run something when downloads finish. Commands run with sh -c and get
# SLSKDPP_EVENT, SLSKDPP_PATH, SLSKDPP_FOLDER, SLSKDPP_USERNAME,
# SLSKDPP_REMOTE_PATH, SLSKDPP_SIZE, SLSKDPP_FILES and SLSKDPP_FAILED.
# The webhook gets the same details as a JSON POST.
hooks:
  on_download: ""   # e.g. beet import -q "$SLSKDPP_PATH"
  on_folder: ""
  webhook: ""

# Folders to share, as "/path" (shared under the folder's name) or
# "Alias=/path". More can be added from the web UI.
shares: []
log_level: info
