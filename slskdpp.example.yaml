# Copy to slskdpp.yaml. Any value can also be set with SLSKDPP_* env vars
# (e.g. SLSKDPP_USERNAME, SLSKDPP_PASSWORD, SLSKDPP_LISTEN_PORT).
soulseek:
  username: ""
  password: ""
  server: server.slsknet.org:2242
  listen_port: 2234   # forward this TCP port on your router for best results

directories:
  data: data          # database and state
  # downloads: data/downloads
  # incomplete: data/incomplete

web:
  listen: ":5030"     # web UI and API
  username: slskdpp
  password: ""        # empty: a random password is generated and logged at startup

shares: []
log_level: info
