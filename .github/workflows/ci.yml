name: CI

on:
  push:
    branches: [master]
  pull_request:
  # The release workflow runs everything here before publishing.
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    name: Go tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "Not gofmt-formatted:"; echo "$unformatted"; exit 1
          fi
      - run: go vet ./...
      - run: go test -race ./...
      - name: Fuzz the protocol decoders briefly
        run: |
          for f in $(go test -list '^Fuzz' ./internal/protocol | grep '^Fuzz'); do
            go test ./internal/protocol -run '^$' -fuzz "^$f\$" -fuzztime 20s
          done

  vulns:
    name: Vulnerability scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: npm audit
        working-directory: web
        run: npm audit --audit-level=high

  web:
    name: Web UI
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: web/dist
          include-hidden-files: true

  build:
    name: Release build
    needs: [go, web]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: web/dist
      - run: make build-go
      - name: Check the binary is static and small
        run: |
          file bin/slskdpp
          file bin/slskdpp | grep -q "statically linked"
          size=$(stat -c %s bin/slskdpp)
          echo "binary: $size bytes"
          test "$size" -lt 26214400
          ./bin/slskdpp -h 2>&1 | head -3
      - uses: actions/upload-artifact@v4
        with:
          name: slskdpp-linux-amd64
          path: bin/slskdpp

  docker:
    name: Docker image
    needs: [go, web]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: slskdpp:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test
        run: |
          # A closed port as the Soulseek server: the client keeps retrying,
          # the web UI and API still answer, and nothing reaches the real network.
          docker run -d --name slskdpp -p 5030:5030 -e SLSKDPP_SERVER=127.0.0.1:9 \
            -e SLSKDPP_USERNAME=ci -e SLSKDPP_PASSWORD=ci -e SLSKDPP_API_KEY=ci-key slskdpp:ci
          for i in $(seq 30); do curl -sf -o /dev/null localhost:5030/ && break; sleep 1; done
          curl -sf localhost:5030/ | grep -q '<div id="app">'
          test "$(curl -s -o /dev/null -w '%{http_code}' localhost:5030/api/v1/server)" = 401
          curl -sf -H 'X-API-Key: ci-key' localhost:5030/api/v0/application/version
          docker image inspect slskdpp:ci --format 'image size: {{.Size}}'
          docker logs slskdpp
