name: CI

on:
  push:
    branches: [master]
  pull_request:
  # The release workflow runs everything here before publishing.
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    name: Go tests
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "Not gofmt-formatted:"; echo "$unformatted"; exit 1
          fi
      - run: go vet ./...
      # Also runs the fuzz seeds and testdata/fuzz inputs as plain tests;
      # the fuzzing itself is in fuzz.yml.
      - run: go test -race ./...

  vulns:
    name: Vulnerability scan
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: npm audit
        working-directory: web
        run: npm audit --audit-level=high

  web:
    name: Web UI
    runs-on: ubuntu-26.04
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm run build
      - uses: actions/upload-artifact@v7
        with:
          name: web-dist
          path: web/dist
          include-hidden-files: true

  build:
    name: Release build
    needs: web
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: actions/download-artifact@v8
        with:
          name: web-dist
          path: web/dist
      - run: make build-go
      - name: Check the binary is static and small
        run: |
          file bin/slskdpp
          file bin/slskdpp | grep -q "statically linked"
          size=$(stat -c %s bin/slskdpp)
          echo "binary: $size bytes"
          test "$size" -lt 26214400
          ./bin/slskdpp -h 2>&1 | head -3
      - uses: actions/upload-artifact@v7
        with:
          name: slskdpp-linux-amd64
          path: bin/slskdpp

  docker:
    name: Docker image
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          load: true
          tags: slskdpp:ci
          cache-from: type=gha,scope=ci-docker
          cache-to: type=gha,scope=ci-docker,mode=max
      - name: Smoke test
        run: .github/smoke-test.sh slskdpp:ci
