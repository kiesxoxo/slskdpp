name: Release

# Pushing a tag like v1.2.3, or running this workflow by hand with a
# version (it then tags the chosen commit itself), runs CI and publishes
# binaries as a GitHub release and multi-platform images on ghcr.io.
# Versions with a hyphen (v1.2.3-rc.1) are pre-releases and do not move
# :latest or :X.Y.
#
# The UI is built once (by CI) and each binary once; the images package
# the same Linux binaries that go in the release. Images are pushed under
# a candidate tag, smoke-tested, and only then given their release tags,
# and the GitHub release is published last.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: Version to release, such as v0.2.0
        required: true

permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  tag:
    name: Tag
    needs: ci
    runs-on: ubuntu-slim
    permissions:
      contents: write
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - id: v
        env:
          INPUT: ${{ inputs.version }}
        run: |
          set -euo pipefail
          version=${INPUT:-$GITHUB_REF_NAME}
          if ! [[ $version =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]; then
            echo "::error::$version is not a version like v1.2.3"; exit 1
          fi
          if ! grep -qF "## [${version#v}]" CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no section for $version"; exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Create the tag
        if: github.event_name == 'workflow_dispatch'
        env:
          VERSION: ${{ steps.v.outputs.version }}
        run: |
          set -euo pipefail
          if git ls-remote --exit-code --tags origin "refs/tags/$VERSION" >/dev/null; then
            echo "::error::$VERSION is already tagged"; exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$VERSION" -m "slskdpp ${VERSION#v}" "$GITHUB_SHA"
          git push origin "refs/tags/$VERSION"

  binaries:
    name: Binaries
    needs: tag
    runs-on: ubuntu-26.04
    env:
      VERSION: ${{ needs.tag.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.tag.outputs.version }}
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Get the UI CI built
        uses: actions/download-artifact@v8
        with:
          name: web-dist
          path: web/dist
      - name: Build binaries
        run: |
          set -euo pipefail
          v=${VERSION#v}
          mkdir -p dist
          for target in linux/amd64 linux/arm64 linux/arm/7 darwin/amd64 darwin/arm64 windows/amd64 freebsd/amd64; do
            IFS=/ read -r os arch arm <<< "$target"
            name="slskdpp_${v}_${os}_${arch}${arm:+v$arm}"
            mkdir -p "build/$name"
            exe=slskdpp; [ "$os" = windows ] && exe=slskdpp.exe
            CGO_ENABLED=0 GOOS=$os GOARCH=$arch GOARM=$arm go build -trimpath \
              -ldflags "-s -w -X github.com/kiesxoxo/slskdpp/internal/version.Version=$VERSION" \
              -o "build/$name/$exe" ./cmd/slskdpp
            # The Linux binaries also go in the images, laid out by Docker platform.
            if [ "$os" = linux ]; then
              mkdir -p "prebuilt/$os/$arch${arm:+/v$arm}"
              cp "build/$name/$exe" "prebuilt/$os/$arch${arm:+/v$arm}/"
            fi
            cp README.md slskdpp.example.yaml "build/$name/"
            [ -f LICENSE ] && cp LICENSE "build/$name/"
            [ "$os" = linux ] && cp packaging/slskdpp.service "build/$name/"
            if [ "$os" = windows ]; then
              (cd build && zip -qr "../dist/$name.zip" "$name")
            else
              tar -C build -czf "dist/$name.tar.gz" "$name"
            fi
          done
          (cd dist && sha256sum * > checksums.txt)
          ls -l dist
      - name: Check the Linux binary
        run: |
          tar -xzf dist/slskdpp_*_linux_amd64.tar.gz -C /tmp
          /tmp/slskdpp_*_linux_amd64/slskdpp -version | tee /dev/stderr | grep -qF "$VERSION"
      - uses: actions/upload-artifact@v7
        with:
          name: release-dist
          path: dist
      - uses: actions/upload-artifact@v7
        with:
          name: image-binaries
          path: prebuilt

  image:
    name: Container images
    needs: [tag, binaries]
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      packages: write
    env:
      VERSION: ${{ needs.tag.outputs.version }}
      PLATFORMS: linux/amd64,linux/arm64,linux/arm/v7
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.tag.outputs.version }}
      - uses: actions/download-artifact@v8
        with:
          name: image-binaries
          path: prebuilt
      - id: names
        run: |
          image=ghcr.io/${GITHUB_REPOSITORY,,}
          echo "image=$image" >> "$GITHUB_OUTPUT"
          echo "candidate=$image:candidate-${VERSION#v}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ steps.names.outputs.image }}
          tags: type=semver,pattern={{version}},value=${{ needs.tag.outputs.version }}
          labels: |
            org.opencontainers.image.title=slskdpp
            org.opencontainers.image.description=A small, headless Soulseek client with a web UI
      # Packaging only: the binaries are already built, so this copies them
      # onto each platform's runtime image without compiling or emulating.
      - name: Push the candidate image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: ${{ env.PLATFORMS }}
          push: true
          build-args: BINARY=prebuilt
          tags: ${{ steps.names.outputs.candidate }}
          labels: ${{ steps.meta.outputs.labels }}
      - name: Push the candidate alpine image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: ${{ env.PLATFORMS }}
          push: true
          build-args: |
            BINARY=prebuilt
            RUNTIME=alpine:3.20
          tags: ${{ steps.names.outputs.candidate }}-alpine
          labels: ${{ steps.meta.outputs.labels }}
      - name: Smoke test the candidates
        env:
          CANDIDATE: ${{ steps.names.outputs.candidate }}
        run: |
          .github/smoke-test.sh "$CANDIDATE" "$VERSION"
          .github/smoke-test.sh "$CANDIDATE-alpine" "$VERSION"
      - name: Promote the candidates
        env:
          IMAGE: ${{ steps.names.outputs.image }}
          CANDIDATE: ${{ steps.names.outputs.candidate }}
        run: |
          set -euo pipefail
          v=${VERSION#v}
          tags=("$v")
          # Pre-releases get only their own version tag.
          if [[ $v != *-* ]]; then
            tags+=("${v%.*}" latest)
          fi
          for suffix in '' -alpine; do
            args=()
            for t in "${tags[@]}"; do args+=(-t "$IMAGE:$t$suffix"); done
            docker buildx imagetools create "${args[@]}" "$CANDIDATE$suffix"
          done
          docker buildx imagetools inspect "$IMAGE:$v"

  release:
    name: GitHub release
    needs: [tag, binaries, image]
    runs-on: ubuntu-slim
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.tag.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.tag.outputs.version }}
      - uses: actions/download-artifact@v8
        with:
          name: release-dist
          path: dist
      - name: Release notes
        run: |
          # The CHANGELOG section for this version, up to the next heading.
          awk -v v="${VERSION#v}" '
            /^## / { if (found) exit; if (index($0, "[" v "]")) { found = 1; next } }
            found' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then echo "CHANGELOG.md has no section for $VERSION"; exit 1; fi
          cat >> notes.md <<NOTES

          ### Install

          - **Docker:** \`docker pull ghcr.io/${GITHUB_REPOSITORY}:${VERSION#v}\` (or \`:${VERSION#v}-alpine\` to run hook commands)
          - **Binary:** download the archive for your system below, check it against \`checksums.txt\`, and see the README.
          NOTES
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pre=""
          case "$VERSION" in *-*) pre="--prerelease" ;; esac
          gh release create "$VERSION" dist/* --title "slskdpp ${VERSION}" --notes-file notes.md --verify-tag $pre
