name: Release

# Pushing a tag like v1.2.3, or running this workflow by hand with a
# version (it then tags the chosen commit itself), runs CI and publishes
# binaries as a GitHub release and multi-platform images on ghcr.io.
# Versions with a hyphen (v1.2.3-rc.1) are pre-releases and do not move
# :latest.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: Version to release, such as v0.2.0
        required: true

permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  tag:
    name: Tag
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        env:
          INPUT: ${{ inputs.version }}
        run: |
          set -euo pipefail
          version=${INPUT:-$GITHUB_REF_NAME}
          if ! [[ $version =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]; then
            echo "::error::$version is not a version like v1.2.3"; exit 1
          fi
          if ! grep -qF "## [${version#v}]" CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no section for $version"; exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Create the tag
        if: github.event_name == 'workflow_dispatch'
        env:
          VERSION: ${{ steps.v.outputs.version }}
        run: |
          set -euo pipefail
          if git ls-remote --exit-code --tags origin "refs/tags/$VERSION" >/dev/null; then
            echo "::error::$VERSION is already tagged"; exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$VERSION" -m "slskdpp ${VERSION#v}" "$GITHUB_SHA"
          git push origin "refs/tags/$VERSION"

  binaries:
    name: Binaries and GitHub release
    needs: tag
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.tag.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.tag.outputs.version }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build the UI
        working-directory: web
        run: npm ci && npm run build
      - name: Build binaries
        run: |
          set -euo pipefail
          v=${VERSION#v}
          mkdir -p dist
          for target in linux/amd64 linux/arm64 linux/arm/7 darwin/amd64 darwin/arm64 windows/amd64 freebsd/amd64; do
            IFS=/ read -r os arch arm <<< "$target"
            name="slskdpp_${v}_${os}_${arch}${arm:+v$arm}"
            mkdir -p "build/$name"
            exe=slskdpp; [ "$os" = windows ] && exe=slskdpp.exe
            CGO_ENABLED=0 GOOS=$os GOARCH=$arch GOARM=$arm go build -trimpath \
              -ldflags "-s -w -X github.com/kiesxoxo/slskdpp/internal/version.Version=$VERSION" \
              -o "build/$name/$exe" ./cmd/slskdpp
            cp README.md slskdpp.example.yaml "build/$name/"
            [ -f LICENSE ] && cp LICENSE "build/$name/"
            [ "$os" = linux ] && cp packaging/slskdpp.service "build/$name/"
            if [ "$os" = windows ]; then
              (cd build && zip -qr "../dist/$name.zip" "$name")
            else
              tar -C build -czf "dist/$name.tar.gz" "$name"
            fi
          done
          (cd dist && sha256sum * > checksums.txt)
          ls -l dist
      - name: Check the Linux binary
        run: |
          tar -xzf dist/slskdpp_*_linux_amd64.tar.gz -C /tmp
          /tmp/slskdpp_*_linux_amd64/slskdpp -version | tee /dev/stderr | grep -qF "$VERSION"
      - name: Release notes
        run: |
          # The CHANGELOG section for this version, up to the next heading.
          awk -v v="${VERSION#v}" '
            /^## / { if (found) exit; if (index($0, "[" v "]")) { found = 1; next } }
            found' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then echo "CHANGELOG.md has no section for $VERSION"; exit 1; fi
          cat >> notes.md <<NOTES

          ### Install

          - **Docker:** \`docker pull ghcr.io/${GITHUB_REPOSITORY}:${VERSION#v}\` (or \`:${VERSION#v}-alpine\` to run hook commands)
          - **Binary:** download the archive for your system below, check it against \`checksums.txt\`, and see the README.
          NOTES
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pre=""
          case "$VERSION" in *-*) pre="--prerelease" ;; esac
          gh release create "$VERSION" dist/* --title "slskdpp ${VERSION}" --notes-file notes.md --verify-tag $pre

  image:
    name: Container images
    needs: tag
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - runtime: gcr.io/distroless/static-debian12:nonroot
            suffix: ''
          - runtime: alpine:3.20
            suffix: '-alpine'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.tag.outputs.version }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          flavor: |
            latest=false
            suffix=${{ matrix.suffix }},onlatest=true
          tags: |
            type=semver,pattern={{version}},value=${{ needs.tag.outputs.version }}
            type=semver,pattern={{major}}.{{minor}},value=${{ needs.tag.outputs.version }}
            type=raw,value=latest,enable=${{ !contains(needs.tag.outputs.version, '-') }}
          labels: |
            org.opencontainers.image.title=slskdpp
            org.opencontainers.image.description=A small, headless Soulseek client with a web UI
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64,linux/arm/v7
          push: true
          build-args: |
            VERSION=${{ needs.tag.outputs.version }}
            RUNTIME=${{ matrix.runtime }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
