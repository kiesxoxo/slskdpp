name: Release

# Pushing a tag like v1.2.3 runs CI, then publishes binaries as a GitHub
# release and multi-platform images on ghcr.io. Tags with a hyphen
# (v1.2.3-rc.1) are marked as pre-releases and do not move :latest.

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  binaries:
    name: Binaries and GitHub release
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build the UI
        working-directory: web
        run: npm ci && npm run build
      - name: Build binaries
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          v=${VERSION#v}
          mkdir -p dist
          for target in linux/amd64 linux/arm64 linux/arm/7 darwin/amd64 darwin/arm64 windows/amd64 freebsd/amd64; do
            IFS=/ read -r os arch arm <<< "$target"
            name="slskdpp_${v}_${os}_${arch}${arm:+v$arm}"
            mkdir -p "build/$name"
            exe=slskdpp; [ "$os" = windows ] && exe=slskdpp.exe
            CGO_ENABLED=0 GOOS=$os GOARCH=$arch GOARM=$arm go build -trimpath \
              -ldflags "-s -w -X github.com/kiesxoxo/slskdpp/internal/version.Version=$VERSION" \
              -o "build/$name/$exe" ./cmd/slskdpp
            cp README.md slskdpp.example.yaml "build/$name/"
            [ -f LICENSE ] && cp LICENSE "build/$name/"
            [ "$os" = linux ] && cp packaging/slskdpp.service "build/$name/"
            if [ "$os" = windows ]; then
              (cd build && zip -qr "../dist/$name.zip" "$name")
            else
              tar -C build -czf "dist/$name.tar.gz" "$name"
            fi
          done
          (cd dist && sha256sum * > checksums.txt)
          ls -l dist
      - name: Check the Linux binary
        run: |
          tar -xzf dist/slskdpp_*_linux_amd64.tar.gz -C /tmp
          /tmp/slskdpp_*_linux_amd64/slskdpp -version | tee /dev/stderr | grep -qF "${GITHUB_REF_NAME}"
      - name: Release notes
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          # The CHANGELOG section for this version, up to the next heading.
          awk -v v="${VERSION#v}" '
            /^## / { if (found) exit; if (index($0, "[" v "]")) { found = 1; next } }
            found' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then echo "CHANGELOG.md has no section for $VERSION"; exit 1; fi
          cat >> notes.md <<NOTES

          ### Install

          - **Docker:** \`docker pull ghcr.io/${GITHUB_REPOSITORY}:${VERSION#v}\` (or \`:${VERSION#v}-alpine\` to run hook commands)
          - **Binary:** download the archive for your system below, check it against \`checksums.txt\`, and see the README.
          NOTES
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ github.ref_name }}
        run: |
          pre=""
          case "$VERSION" in *-*) pre="--prerelease" ;; esac
          gh release create "$VERSION" dist/* --title "slskdpp ${VERSION}" --notes-file notes.md --verify-tag $pre

  image:
    name: Container images
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - runtime: gcr.io/distroless/static-debian12:nonroot
            suffix: ''
          - runtime: alpine:3.20
            suffix: '-alpine'
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          flavor: |
            latest=false
            suffix=${{ matrix.suffix }},onlatest=true
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') }}
          labels: |
            org.opencontainers.image.title=slskdpp
            org.opencontainers.image.description=A small, headless Soulseek client with a web UI
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64,linux/arm/v7
          push: true
          build-args: |
            VERSION=${{ github.ref_name }}
            RUNTIME=${{ matrix.runtime }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
